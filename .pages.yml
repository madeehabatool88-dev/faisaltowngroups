  - name: projects_property
    label: Property & Project Pages
    type: collection
    path: src/content/projects
    format: json
    subfolders: false
    filename: "{slug}.json"
    view:
      layout: list
      fields:
        - h1
        - pageType
        - phase
        - updated
        - status
    fields:
      - name: h1
        label: Page Title
        type: string
        required: true
        description: Main on-page heading. Write for the buyer first, not for internal naming.
      - name: slug
        label: URL Slug
        type: string
        required: true
        description: Permanent page URL. Do not change an existing slug unless you also create a redirect.
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - published
            - draft
      - name: title
        label: SEO Title
        type: string
        required: true
        description: Search-result title. Keep it clear, specific and usually under about 60 characters.
      - name: description
        label: Meta Description
        type: text
        required: true
        description: Search-result description. Summarize the useful answer and current buyer intent.
      - name: updated
        label: Last Updated
        type: date
        required: true
        description: Change only after a meaningful factual or editorial update.
      - name: reviewed
        label: Reviewed Date
        type: date
        required: true
      - name: pageType
        label: Page Type
        type: select
        required: false
        options:
          values:
            - Project Hub
            - Sector Guide
            - Block Guide
            - Enclave Guide
            - Property Search
            - Map & Location
      - name: phase
        label: Phase / Area
        type: select
        required: false
        options:
          values:
            - Phase 1 / F-18
            - Phase 2 / FT-II
            - Phase 1 & Phase 2
      - name: eyebrow
        label: Eyebrow
        type: string
        required: false
        description: Short label above the page title.
      - name: intro
        label: Introduction
        type: text
        required: true
        description: One concise paragraph under the page title.
      - name: image
        label: Main Page / Social Sharing Image
        type: image
        required: true
      - name: imageAlt
        label: Main Image Description
        type: string
        required: true
