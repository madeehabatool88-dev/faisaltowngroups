      - name: heroBackgroundImage
        label: Hero Background Image
        type: image
        required: false
        description: Decorative background behind the page title. Clear for a plain background.
      - name: showMainImage
        label: Show Main Page Image
        type: boolean
        required: false
        description: Show the main image below the page summary. The image also supplies the social sharing preview.
      - name: imageCaption
        label: Main Image Caption
        type: text
        required: false
        description: Caption below the main page image.
      - name: quickAnswerLabel
        label: Quick Answer Label
        type: string
        required: false
      - name: quickAnswerHeading
        label: Quick Answer Heading
        type: string
        required: false
      - name: verificationLabel
        label: Verification Notice Label
        type: string
        required: false
