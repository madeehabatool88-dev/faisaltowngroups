actions:
  - name: validate-site
    label: Check saved content
    workflow: validate-site.yml
    ref: main
    confirm: false
  - name: deploy-site
    label: Deploy live website
    workflow: deploy-site.yml
    ref: main
    confirm: false
media:
  - name: images
    label: Website Images
    input: public/assets
    output: /assets
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
    rename: safe
  - name: project_images
    label: Project Images
    input: public/assets/projects
    output: /assets/projects
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
    rename: safe
  - name: maps
    label: Maps & Location Images
    input: public/assets/maps
    output: /assets/maps
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
    rename: safe
  - name: article_images
    label: Article Images
    input: public/assets/articles
    output: /assets/articles
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
    rename: safe
  - name: uploads
    label: New Uploads
    input: public/assets/uploads
    output: /assets/uploads
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
    rename: safe
  - name: plans
    label: Master Plans & PDFs
    input: public/assets/plans
    output: /assets/plans
    categories:
      - document
    extensions:
      - pdf
    rename: safe
content:
  - name: main_website
    label: Main Website
    type: group
    items:
      - name: homepage
        label: Homepage
        type: group
        items:
          - name: homepage_controls
            label: 00 - Section Controls
            type: file
            path: src/content/homepage/controls.json
            format: json
            description: >-
              These switches control the current homepage. Turn a section off to hide it without deleting its
              saved content.
            fields:
              - name: hero
                label: SEO & Hero Enabled
                type: boolean
                required: false
              - name: trust
                label: Trust / Authorized Partner Enabled
                type: boolean
                required: false
              - name: featuredOffer
                label: Featured Phase 2 Offer Enabled
                type: boolean
                required: false
              - name: prices
                label: Plot Sizes & Prices Enabled
                type: boolean
                required: false
              - name: budgets
                label: Find by Budget Enabled
                type: boolean
                required: false
              - name: sectors
                label: Phase 2 Sectors Enabled
                type: boolean
                required: false
              - name: development
                label: Development Updates Enabled
                type: boolean
                required: false
              - name: masterPlan
                label: Master Plan Enabled
                type: boolean
                required: false
              - name: buyerSupport
                label: Why Buy Through Us Enabled
                type: boolean
                required: false
              - name: buyingProcess
                label: How Buying Works Enabled
                type: boolean
                required: false
              - name: visitOverseas
                label: Site Visit / Overseas Buyers Enabled
                type: boolean
                required: false
              - name: faqs
                label: FAQs Enabled
                type: boolean
                required: false
              - name: buyerGuides
                label: Buyer Guides Enabled
                type: boolean
                required: false
              - name: finalCta
                label: Final WhatsApp CTA Enabled
                type: boolean
                required: false
              - name: phase1
                label: Phase 1 Secondary Project Enabled
                type: boolean
                required: false
            operations:
              delete: false
              rename: false
          - name: homepage_hero
            label: 01 - SEO & Hero
            type: file
            path: src/content/homepage/hero.json
            format: json
            description: >-
              Current homepage hero. The starting price comes from 03 - Featured Offer facts, not the separate
              Sector P table in 04.
            fields:
              - name: seoTitle
                label: SEO Title
                type: string
                description: Title shown in Google search results.
              - name: metaDescription
                label: Meta Description
                type: text
                description: Search result description.
              - name: topStripLabel
                label: Top Strip Label
                type: string
              - name: topStripText
                label: Top Strip Text
                type: text
              - name: heroImage
                label: Hero Image
                type: image
              - name: heroImageAlt
                label: Hero Image Alt Text
                type: string
              - name: heroEyebrow
                label: Hero Eyebrow
                type: string
              - name: h1
                label: H1 Heading
                type: string
              - name: intro
                label: Introduction
                type: text
              - name: primaryCta
                label: Primary CTA
                type: string
              - name: secondaryCta
                label: Secondary CTA
                type: string
              - name: whatsappCard
                label: WhatsApp Card
                type: object
                fields:
                  - name: label
                    label: Label
                    type: string
                  - name: heading
                    label: Heading
                    type: string
                  - name: text
                    label: Text
                    type: text
                  - name: actionsText
                    label: WhatsApp Actions - Bulk Edit
                    type: text
                    required: false
                    description: >-
                      Paste all items here, one per line: Button label | WhatsApp message. Spreadsheet columns
                      also work. Keep empty optional columns between separators. Reorder by moving lines.
              - name: updated
                label: Updated Date
                type: date
              - name: reviewed
                label: Reviewed Date
                type: date
              - name: startingPriceLabel
                label: Starting Price Label
                type: string
                required: false
              - name: priceDisclaimer
                label: Price Disclaimer
                type: text
                required: false
              - name: trustPointsText
                label: Trust Points - Bulk Edit
                type: text
                required: false
                description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
              - name: primaryCtaType
                label: primary CTA Type
                type: select
                required: false
                options:
                  values:
                    - whatsapp
                    - phone
                    - internal
              - name: primaryHref
                label: primary Link
                type: string
                required: false
              - name: primaryWhatsappQuery
                label: primary WhatsApp Message
                type: text
                required: false
              - name: secondaryCtaType
                label: secondary CTA Type
                type: select
                required: false
                options:
                  values:
                    - whatsapp
                    - phone
                    - internal
              - name: secondaryHref
                label: secondary Link
                type: string
                required: false
              - name: secondaryWhatsappQuery
                label: secondary WhatsApp Message
                type: text
                required: false
            operations:
              delete: false
              rename: false
          - name: homepage_trust
            label: 02 - Trust / Authorized Partner
            type: file
            path: src/content/homepage/trust.json
            format: json
            description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
                required: false
              - name: heading
                label: Heading
                type: string
                required: false
              - name: text
                label: Description
                type: text
                required: false
              - name: showPartnerStatement
                label: Show Global Partner Statement
                type: boolean
                required: false
              - name: authorizationImage
                label: Authorization Image
                type: image
                required: false
              - name: authorizationImageAlt
                label: Image Alt
                type: string
                required: false
              - name: showAuthorizationImage
                label: Show Authorization Image
                type: boolean
                required: false
            operations:
              delete: false
              rename: false
          - name: homepage_offer
            label: 03 - Featured Offer (currently Sector T)
            type: file
            path: src/content/homepage/featured-offer.json
            format: json
            description: >-
              Edits the featured offer and homepage starting price. Current local content features Sector T.
              Keep its heading, link, facts, WhatsApp message and plan consistent.
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Image Alt Text
                type: string
              - name: eyebrow
                label: Eyebrow
                type: string
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Text
                type: text
              - name: primaryCta
                label: Primary CTA
                type: string
                description: Label for the primary WhatsApp action. Its message is stored below in secondaryQuery.
              - name: primaryHref
                label: Primary Link
                type: string
              - name: secondaryCta
                label: Secondary CTA
                type: string
                description: Label for the secondary details link. Its destination is stored in primaryHref.
              - name: secondaryQuery
                label: Secondary WhatsApp Query
                type: text
              - name: status
                label: Status
                type: select
                required: false
                options:
                  values:
                    - Featured
                    - Available
                    - Limited
                    - Ask for availability
                    - Sold
              - name: factsText
                label: Feature Facts - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all facts at once: Value | Label, one line each. The value labelled discounted price
                  or discounted listed price supplies the homepage starting price. Keep the heading and
                  message consistent.
              - name: sectorPlan
                label: Featured Sector Plan
                type: object
                fields:
                  - name: eyebrow
                    label: Eyebrow
                    type: string
                  - name: heading
                    label: Heading
                    type: string
                  - name: text
                    label: Text
                    type: text
                  - name: image
                    label: Plan Preview Image
                    type: image
                  - name: alt
                    label: Image Alt Text
                    type: string
                  - name: pdf
                    label: Plan PDF
                    type: string
                  - name: whatsappQuery
                    label: WhatsApp Query
                    type: text
            operations:
              delete: false
              rename: false
          - name: homepage_prices
            label: 04 - Sector P Cash Prices
            type: file
            path: src/content/homepage/prices.json
            format: json
            description: >-
              Separate Sector P cash-price table. This does not set the homepage Sector T starting price.
              Paste all price rows in the bulk field.
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Text
                type: text
              - name: note
                label: Buyer Note
                type: text
              - name: rowsText
                label: Shared Plot Offers - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Dimensions | Marla/Kanal | Original PKR | Current PKR |
                  Availability | Enabled (yes/no) | WhatsApp message. Spreadsheet columns also work. Keep
                  empty optional columns between separators. Reorder by moving lines.
            operations:
              delete: false
              rename: false
          - name: homepage_budgets
            label: 05 - Find by Budget
            type: file
            path: src/content/homepage/budgets.json
            format: json
            description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
                required: false
              - name: heading
                label: Heading
                type: string
                required: false
              - name: text
                label: Description
                type: text
                required: false
              - name: itemsText
                label: Budget Options - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Label | Description | WhatsApp message | Enabled
                  (yes/no). Spreadsheet columns also work. Keep empty optional columns between separators.
                  Reorder by moving lines.
            operations:
              delete: false
              rename: false
          - name: homepage_sectors
            label: 06 - Phase 2 Sectors
            type: file
            path: src/content/homepage/sectors.json
            format: json
            description: >-
              Current O, P, Q, R, S and T cards. Paste and reorder all cards in one box. The featured sector
              is sorted first by its saved details URL.
            fields:
              - name: heading
                label: Heading
                type: string
                required: false
              - name: sectorsText
                label: Sector Cards - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Name/sub-name | Page URL | Description | Image path |
                  Alt text | Status | WhatsApp message | Enabled (yes/no). Spreadsheet columns also work. Keep
                  empty optional columns between separators. Reorder by moving lines.
            operations:
              delete: false
              rename: false
          - name: homepage_development
            label: 07 - Development Updates
            type: file
            path: src/content/homepage/development.json
            format: json
            description: >-
              Current development content remains editable. Additional images, date and video are prepared for
              the redesign.
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Text
                type: text
              - name: cta
                label: CTA Label
                type: string
              - name: query
                label: WhatsApp Query
                type: text
              - name: image
                label: Development Image
                type: image
              - name: alt
                label: Image Alt Text
                type: string
              - name: caption
                label: Caption
                type: string
              - name: updateDate
                label: Actual Update Date
                type: date
                required: false
              - name: additionalImagesText
                label: Additional Images - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Image path | Alt text | Caption. Spreadsheet columns
                  also work. Keep empty optional columns between separators. Reorder by moving lines.
              - name: videoUrl
                label: Video URL
                type: string
                required: false
            operations:
              delete: false
              rename: false
          - name: homepage_master_plan
            label: 08 - Master Plan
            type: file
            path: src/content/homepage/master-plan.json
            format: json
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Text
                type: text
              - name: image
                label: Master Plan Image
                type: image
              - name: alt
                label: Image Alt Text
                type: string
              - name: caption
                label: Caption
                type: string
              - name: pdf
                label: Master Plan PDF
                type: string
              - name: whatsappQuery
                label: WhatsApp Query
                type: text
              - name: viewLabel
                label: View Button Label
                type: string
                required: false
              - name: whatsappLabel
                label: WhatsApp Button Label
                type: string
                required: false
            operations:
              delete: false
              rename: false
          - name: homepage_support
            label: 09 - Why Buy Through Us
            type: file
            path: src/content/homepage/buyer-support.json
            format: json
            description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
                required: false
              - name: heading
                label: Heading
                type: string
                required: false
              - name: text
                label: Description
                type: text
                required: false
              - name: itemsText
                label: Support Cards - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Title | Description | Icon (check/map/phone/home/globe)
                  | Enabled (yes/no). Spreadsheet columns also work. Keep empty optional columns between
                  separators. Reorder by moving lines.
            operations:
              delete: false
              rename: false
          - name: homepage_process
            label: 10 - How Buying Works
            type: file
            path: src/content/homepage/buying-process.json
            format: json
            description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
                required: false
              - name: heading
                label: Heading
                type: string
                required: false
              - name: text
                label: Description
                type: text
                required: false
              - name: stepsText
                label: Buying Steps - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Title | Description | Enabled (yes/no). Spreadsheet
                  columns also work. Keep empty optional columns between separators. Reorder by moving lines.
            operations:
              delete: false
              rename: false
          - name: homepage_assistance
            label: 11 - Site Visit / Overseas Buyers
            type: file
            path: src/content/homepage/visit-overseas.json
            format: json
            description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
            fields:
              - name: siteVisit
                label: Site Visit
                type: object
                fields:
                  - name: enabled
                    label: Enabled
                    type: boolean
                    required: false
                  - name: heading
                    label: Heading
                    type: string
                    required: false
                  - name: text
                    label: Description
                    type: text
                    required: false
                  - name: image
                    label: Image
                    type: image
                    required: false
                  - name: alt
                    label: Image Alt
                    type: string
                    required: false
                  - name: ctaLabel
                    label: Button Label
                    type: string
                    required: false
                  - name: ctaType
                    label: Button Type
                    type: select
                    required: false
                    options:
                      values:
                        - whatsapp
                        - phone
                        - internal
                  - name: whatsappQuery
                    label: WhatsApp Message
                    type: text
                    required: false
                  - name: href
                    label: Internal Link
                    type: string
                    required: false
              - name: overseas
                label: Overseas Buyers
                type: object
                fields:
                  - name: enabled
                    label: Enabled
                    type: boolean
                    required: false
                  - name: heading
                    label: Heading
                    type: string
                    required: false
                  - name: text
                    label: Description
                    type: text
                    required: false
                  - name: image
                    label: Image
                    type: image
                    required: false
                  - name: alt
                    label: Image Alt
                    type: string
                    required: false
                  - name: ctaLabel
                    label: Button Label
                    type: string
                    required: false
                  - name: ctaType
                    label: Button Type
                    type: select
                    required: false
                    options:
                      values:
                        - whatsapp
                        - phone
                        - internal
                  - name: whatsappQuery
                    label: WhatsApp Message
                    type: text
                    required: false
                  - name: href
                    label: Internal Link
                    type: string
                    required: false
            operations:
              delete: false
              rename: false
          - name: homepage_faqs
            label: 12 - FAQs
            type: file
            path: src/content/homepage/faqs.json
            format: json
            description: Edits this section of the current homepage. Visibility follows 00 - Section Controls.
            fields:
              - name: heading
                label: Heading
                type: string
                required: false
              - name: faqsText
                label: FAQs - Bulk Edit
                type: text
                required: false
                description: >-
                  Paste all items here, one per line: Question | Answer | Enabled (yes/no). Spreadsheet
                  columns also work. Keep empty optional columns between separators. Reorder by moving lines.
            operations:
              delete: false
              rename: false
          - name: homepage_guides
            label: 13 - Buyer Guides
            type: file
