        required: false
      - name: checklistHeading
        label: Buyer Checklist Heading
        type: string
        required: false
      - name: downloadsLabel
        label: Downloads Section Label
        type: string
        required: false
      - name: downloadsHeading
        label: Downloads Section Heading
        type: string
        required: false
      - name: downloadButtonLabel
        label: Download Button Label
        type: string
        required: false
      - name: faqLabel
        label: FAQ Section Label
        type: string
        required: false
      - name: faqHeading
        label: FAQ Section Heading
        type: string
        required: false
      - name: relatedLabel
        label: Related Pages Label
        type: string
        required: false
      - name: relatedHeading
        label: Related Pages Heading
        type: string
        required: false
      - name: sectionLinksText
        label: Body Section Buttons - Bulk Edit
