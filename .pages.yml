media:
  - name: images
    label: Website Images
    input: public/assets
    output: /assets
    categories: [image]
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: project_images
    label: Project Images
    input: public/assets/projects
    output: /assets/projects
    categories: [image]
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: maps
    label: Maps & Location Images
    input: public/assets/maps
    output: /assets/maps
    categories: [image]
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: article_images
    label: Article Images
    input: public/assets/articles
    output: /assets/articles
    categories: [image]
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: uploads
    label: New Uploads
    input: public/assets/uploads
    output: /assets/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: plans
    label: Master Plans & PDFs
    input: public/assets/plans
    output: /assets/plans
    categories: [document]
    extensions: [pdf]
    rename: safe

content:
  - name: main_website
    label: Main Website
    type: group
    items:
      - name: homepage
        label: Homepage
        type: file
        path: src/content/homepage.json
        format: json
        fields:
          - name: seoTitle
            label: SEO Title
            type: string
            description: Title shown in Google search results.
          - name: metaDescription
            label: Meta Description
            type: text
            description: Search result description.
          - { name: topStripLabel, label: Top Strip Label, type: string }
          - { name: topStripText, label: Top Strip Text, type: text }
          - { name: heroImage, label: Hero Image, type: image }
          - { name: heroImageAlt, label: Hero Image Alt Text, type: string }
          - { name: heroEyebrow, label: Hero Eyebrow, type: string }
          - { name: h1, label: H1 Heading, type: string }
          - { name: intro, label: Introduction, type: text }
          - { name: primaryCta, label: Primary CTA, type: string }
          - { name: secondaryCta, label: Secondary CTA, type: string }
          - name: whatsappCard
            label: WhatsApp Card
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
              - name: actions
                label: WhatsApp Actions
                type: object
                list: true
                fields:
                  - { name: label, label: Button Label, type: string }
                  - { name: query, label: WhatsApp Query, type: text }
          - name: projectChoice
            label: Project Choice Section
            type: object
            fields:
              - { name: eyebrow, label: Eyebrow, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
              - name: cards
                label: Project Choice Cards
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: text, label: Text, type: text }
                  - { name: primaryLabel, label: Primary Button Label, type: string }
                  - { name: primaryHref, label: Primary Link, type: string }
                  - { name: secondaryLabel, label: Secondary Button Label, type: string }
                  - { name: secondaryQuery, label: WhatsApp Query, type: text }
          - name: phase2
            label: Featured Phase 2 Section
            type: object
            fields:
              - { name: eyebrow, label: Eyebrow, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
              - { name: primaryCta, label: Primary CTA, type: string }
              - { name: primaryHref, label: Primary Link, type: string }
              - { name: secondaryCta, label: Secondary CTA, type: string }
              - { name: secondaryQuery, label: Secondary WhatsApp Query, type: text }
              - name: masterPlan
                label: Master Plan Block
                type: object
                fields:
                  - { name: eyebrow, label: Eyebrow, type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: text, label: Text, type: text }
                  - { name: image, label: Master Plan Image, type: image }
                  - { name: alt, label: Image Alt Text, type: string }
                  - { name: caption, label: Caption, type: string }
                  - { name: pdf, label: Master Plan PDF, type: string }
                  - { name: whatsappQuery, label: WhatsApp Query, type: text }
              - { name: sectorsHeading, label: Sectors Heading, type: string }
              - name: sectors
                label: Phase 2 Sector Cards
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string }
                  - { name: href, label: Link, type: string }
                  - { name: text, label: Text, type: text }
              - name: sectorP
                label: Sector P Feature
                type: object
                fields:
                  - { name: image, label: Image, type: image }
                  - { name: alt, label: Image Alt Text, type: string }
                  - { name: eyebrow, label: Eyebrow, type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: text, label: Text, type: text }
                  - name: facts
                    label: Fact Boxes
                    type: object
                    list: true
                    fields:
                      - { name: value, label: Value, type: string }
                      - { name: label, label: Label, type: string }
                  - { name: primaryCta, label: Primary CTA, type: string }
                  - { name: primaryHref, label: Primary Link, type: string }
                  - { name: secondaryCta, label: Secondary CTA, type: string }
                  - { name: secondaryQuery, label: Secondary WhatsApp Query, type: text }
              - name: priceTable
                label: Homepage Price Table
                type: object
                fields:
                  - { name: eyebrow, label: Eyebrow, type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: text, label: Text, type: text }
                  - { name: note, label: Buyer Note, type: text }
                  - name: rows
                    label: Price Rows
                    type: object
                    list: true
                    fields:
                      - { name: size, label: Plot Size, type: string }
                      - { name: marla, label: Marla/Kanal, type: string }
                      - { name: actual, label: Actual Price, type: string }
                      - { name: discount, label: Discounted Price, type: string }
              - name: sectorPlan
                label: Sector P Plan
                type: object
                fields:
                  - { name: eyebrow, label: Eyebrow, type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: text, label: Text, type: text }
                  - { name: image, label: Plan Preview Image, type: image }
                  - { name: alt, label: Image Alt Text, type: string }
                  - { name: pdf, label: Plan PDF, type: string }
                  - { name: whatsappQuery, label: WhatsApp Query, type: text }
              - name: development
                label: Development Block
                type: object
                fields:
                  - { name: eyebrow, label: Eyebrow, type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: text, label: Text, type: text }
                  - { name: cta, label: CTA Label, type: string }
                  - { name: query, label: WhatsApp Query, type: text }
                  - { name: image, label: Development Image, type: image }
                  - { name: alt, label: Image Alt Text, type: string }
                  - { name: caption, label: Caption, type: string }
              - name: articleSlugs
                label: Related Article Slugs
                type: string
                list: true
                required: false
          - name: phase1
            label: Featured Phase 1 Section
            type: object
            fields:
              - { name: eyebrow, label: Eyebrow, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
              - { name: primaryCta, label: Primary CTA, type: string }
              - { name: primaryHref, label: Primary Link, type: string }
              - { name: secondaryCta, label: Secondary CTA, type: string }
              - { name: secondaryQuery, label: Secondary WhatsApp Query, type: text }
              - name: blocks
                label: Phase 1 Block Cards
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string }
                  - { name: href, label: Link, type: string }
                  - { name: text, label: Text, type: text }
              - { name: featureImage, label: Feature Image, type: image }
              - { name: featureImageAlt, label: Feature Image Alt Text, type: string }
              - { name: featureEyebrow, label: Feature Eyebrow, type: string }
              - { name: featureHeading, label: Feature Heading, type: string }
              - { name: featureText, label: Feature Text, type: text }
              - { name: featureCta, label: Feature CTA, type: string }
              - { name: featureQuery, label: Feature WhatsApp Query, type: text }
              - name: articleSlugs
                label: Related Article Slugs
                type: string
                list: true
                required: false
          - name: contact
            label: Contact Section
            type: object
            fields:
              - { name: eyebrow, label: Eyebrow, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
              - { name: mainQuery, label: Main WhatsApp Query, type: text }
              - { name: leadLabel, label: Lead Box Label, type: string }
              - { name: leadHeading, label: Lead Box Heading, type: string }
              - name: options
                label: WhatsApp Options
                type: object
                list: true
                fields:
                  - { name: label, label: Button Label, type: string }
                  - { name: query, label: WhatsApp Query, type: text }
          - { name: updated, label: Updated Date, type: date }
          - { name: reviewed, label: Reviewed Date, type: date }
        operations:
          delete: false
          rename: false

      - name: site_settings
        label: Site Settings
        type: file
        path: src/data/site.json
        format: json
        fields:
          - { name: name, label: Website Name, type: string }
          - { name: domain, label: Canonical Domain, type: string }
          - { name: phoneDisplay, label: Display Phone, type: string }
          - { name: phoneWhatsApp, label: WhatsApp Number, type: string }
          - { name: defaultImage, label: Default Social Image, type: image }
          - { name: disclosure, label: Disclosure, type: text }
          - { name: globalPrimaryCta, label: Global Primary CTA, type: string }
          - { name: globalSecondaryCta, label: Global Secondary CTA, type: string }
        operations:
          delete: false
          rename: false

  - name: projects_property
    label: Projects & Property Pages
    type: collection
    path: src/content/projects
    format: json
    subfolders: false
    filename: "{slug}.json"
    view:
      layout: list
      fields: [h1, pageType, phase, slug, status, updated, order]
    fields:
      - name: order
        label: Display Order
        type: number
        description: Lower numbers appear first.
      - name: status
        label: Status
        type: select
        options:
          values: [published, draft]
      - name: slug
        label: Slug
        type: string
        description: Do not change unless intentionally changing the page URL.
      - name: pageType
        label: Page Type
        type: select
        required: false
        options:
          values:
            - Project Hub
            - Sector Guide
            - Block Guide
            - Enclave Guide
            - Property Search
            - Map & Location
      - name: phase
        label: Phase / Area
        type: select
        required: false
        options:
          values:
            - Phase 1 / F-18
            - Phase 2 / FT-II
            - Phase 1 & Phase 2
      - name: title
        label: SEO Title
        type: string
        description: Title shown in Google search results.
      - name: description
        label: Meta Description
        type: text
        description: Search result description.
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: h1, label: Page Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: image, label: Featured Image, type: image }
      - { name: primaryCta, label: Primary CTA, type: string }
      - { name: secondaryCta, label: Secondary CTA, type: string }
      - { name: updated, label: Updated Date, type: date }
      - { name: reviewed, label: Reviewed Date, type: date }
      - name: sections
        label: Content Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - name: bullets
        label: Buyer Checklist / Bullet Sections
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: downloads
        label: Download Links
        type: object
        list: true
        required: false
        fields:
          - { name: label, label: Label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: href, label: URL or PDF Path, type: string }
      - name: highlights
        label: Highlights
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - name: links
        label: Related Links
        type: object
        list: true
        fields:
          - { name: label, label: Anchor Text, type: string }
          - { name: href, label: URL, type: string }
    operations:
      create: true
      rename: true
      delete: false

  - name: articles_guides
    label: Articles & Buyer Guides
    type: collection
    path: src/content/articles
    format: json
    subfolders: false
    filename: "{slug}.json"
    view:
      layout: list
      fields: [title, cluster, category, status, updated, order]
    fields:
      - name: order
        label: Display Order
        type: number
        description: Lower numbers appear first.
      - name: status
        label: Status
        type: select
        options:
          values: [published, draft]
      - name: slug
        label: Slug
        type: string
        description: Do not change unless intentionally changing the page URL.
      - { name: title, label: Article Title, type: string }
      - name: seoTitle
        label: SEO Title
        type: string
        required: false
        description: Title shown in Google search results.
      - name: metaDescription
        label: Meta Description
        type: text
        required: false
        description: Search result description.
      - { name: description, label: Archive Description, type: text }
      - { name: intro, label: Introduction, type: text, required: false }
      - name: category
        label: Category
        type: select
        options:
          values:
            - Projects
            - Buyer Guide
            - Master Plan
            - Sector P
            - Living
            - Project References
            - Location
            - Lifestyle
            - Prices
            - Investment Guide
      - name: cluster
        label: Cluster
        type: select
        required: false
        options:
          values:
            - Comparisons
            - Investment & Buyer Guides
            - Location & Maps
            - Faisal Town Phase 2
            - Prices & Payment Plans
      - { name: date, label: Publish Date, type: date }
      - { name: updated, label: Updated Date, type: date, required: false }
      - { name: reviewed, label: Reviewed Date, type: string, required: false }
      - { name: image, label: Featured Image, type: image }
      - { name: readTime, label: Read Time, type: string }
      - name: body
        label: Full Article Body
        type: text
        description: Edit the full article in one place. Use ## for section headings, - for bullet points, and > for highlighted notes.
      - name: relatedSlugs
        label: Related Article Slugs
        type: string
        list: true
        required: false
      - name: cta
        label: Article CTA
        type: object
        required: false
        fields:
          - { name: label, label: Label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: message, label: WhatsApp Message, type: text }
          - { name: button, label: Button Label, type: string }
      - name: faqs
        label: FAQs
        type: object
        list: true
        required: false
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
    operations:
      create: true
      rename: true
      delete: false

  - name: legal_pages
    label: Legal Pages
    type: collection
    path: src/content/legal
    format: json
    subfolders: false
    view:
      layout: list
      fields: [heading, updated]
    fields:
      - name: title
        label: SEO Title
        type: string
        description: Title shown in Google search results.
      - name: description
        label: Meta Description
        type: text
        description: Search result description.
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: heading, label: Page Heading, type: string }
      - { name: subheading, label: Subheading, type: text }
      - { name: updated, label: Updated Date, type: date }
      - name: sections
        label: Legal Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - { name: ctaLabel, label: CTA Label, type: string }
      - { name: ctaQuery, label: CTA WhatsApp Query, type: text }
    operations:
      create: false
      rename: false
      delete: false

  - name: editor_guide
    label: Editing Guide
    type: file
    path: CONTENT-EDITING-GUIDE.md
    format: markdown
    operations:
      delete: false
      rename: false

settings:
  commit:
    templates:
      create: "content: add {name}"
      update: "content: update {name}"
      delete: "content: remove {name}"
      uploadMedia: "media: upload {path}"
