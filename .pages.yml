      - name: quickAnswer
        label: Quick Answer
        type: text
        required: false
        description: A short buyer-focused answer shown near the top of the page. Clear to remove the answer text.
      - name: highlightsText
        label: Key Highlights - Bulk Editor
        type: text
        required: false
