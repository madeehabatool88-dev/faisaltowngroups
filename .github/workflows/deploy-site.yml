name: Deploy live website

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build every page
        run: npm run build

      - name: Add deployment version
        run: |
          echo "$GITHUB_SHA" > dist/deploy-version.txt

      - name: Check hosting connection settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0

          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error::Add the $key repository secret. See DEPLOYMENT.md."
              missing=1
            fi
          done

          [ "$missing" = 0 ] || exit 1

          case "$FTP_SERVER_DIR" in
            */)
              ;;
            *)
              echo "::error::FTP_SERVER_DIR must end with /."
              exit 1
              ;;
          esac

      - name: Upload changed files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**
            .ftpquota

      - name: Verify exact deployment version
        run: |
          echo "Checking deployment version..."

          LIVE_SHA=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "https://www.faisaltowngroups.com/deploy-version.txt?cache=$GITHUB_SHA")

          echo "Expected commit: $GITHUB_SHA"
          echo "Live commit:     $LIVE_SHA"

          if [ "$LIVE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Live website does not contain the expected deployment version."
            exit 1
          fi

          echo "Deployment version verified successfully."

      - name: Verify important live pages
        run: |
          pages=(
            "/"
            "/faisal-town-phase-2/"
            "/articles/faisal-town-complete-guide/"
            "/sitemap.xml"
          )

          for path in "${pages[@]}"; do
            echo "Checking https://www.faisaltowngroups.com$path"

            status=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              --retry 3 \
              "https://www.faisaltowngroups.com$path?deploy=$GITHUB_SHA")

            if [ "$status" != "200" ]; then
              echo "::error::$path returned HTTP $status"
              exit 1
            fi

            echo "$path returned HTTP 200"
          done

      - name: Deployment completed
        run: |
          echo "FaisalTownGroups deployment completed successfully."
          echo "Commit: $GITHUB_SHA"
          echo "Live site: https://www.faisaltowngroups.com/"
