name: Deploy live website

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build every page
        run: npm run build

      - name: Check SSH deployment settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=0

          for key in SSH_HOST SSH_PORT SSH_USERNAME SSH_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Add the $key repository secret."
              missing=1
            fi
          done

          [ "$missing" = 0 ] || exit 1

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy site to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" \
            rsync \
            -avz \
            --delete \
            --exclude=".well-known/" \
            --exclude="cgi-bin/" \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./dist/ \
            "$SSH_USERNAME@$SSH_HOST:public_html/"

      - name: Verify important live pages
        run: |
          pages=(
            "/"
            "/faisal-town-phase-2/"
            "/articles/faisal-town-complete-guide/"
            "/sitemap.xml"
          )

          for path in "${pages[@]}"; do
            echo "Checking https://www.faisaltowngroups.com$path"

            status=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              --retry 5 \
              --retry-delay 3 \
              "https://www.faisaltowngroups.com$path?deploy=$GITHUB_SHA")

            if [ "$status" != "200" ]; then
              echo "::error::$path returned HTTP $status"
              exit 1
            fi

            echo "$path returned HTTP 200"
          done

      - name: Deployment completed
        run: |
          echo "FaisalTownGroups deployment completed successfully."
          echo "Commit: $GITHUB_SHA"
          echo "Live site: https://www.faisaltowngroups.com/"
